plugins {
    id 'com.gradleup.shadow'
}

version = "${rootProject.mod_version}+mc${project.minecraft_version}-fabric"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}


dependencies {
    def mod = obfuscated ? 'modImplementation' : 'implementation'
    "$mod" "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    "$mod" "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    // The same Minecraft version's node of the common branch.
    def commonNode = ":common:$project.name"
    common(project(path: commonNode, configuration: obfuscated ? 'namedElements' : 'default')) { transitive = false }
    shadowBundle(project(path: commonNode, configuration: 'transformProductionFabric')) { transitive = false }

    if (obfuscated) {
        productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
    }
}

processResources {
    def props = [version: project.version, fabric_loader_range: project.fabric_loader_range,
                 minecraft_version: project.minecraft_version, java_version: project.java_version]
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }
}

if (obfuscated) {
    shadowJar {
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = 'dev-shadow'
    }

    // Obfuscated versions: the shipped jar is the shadow jar remapped to the names the loader runs on.
    remapJar {
        inputFile.set shadowJar.archiveFile
    }

} else {
    // The game is not obfuscated from 26.1 on, so there is no remapJar: the shipped jar is the shadow jar.
    jar {
        archiveClassifier = 'raw'
    }

    shadowJar {
        exclude 'architectury.common.json'

        dependsOn jar
        mainSpec.sourcePaths.clear()
        from(zipTree(jar.archiveFile))
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = null
    }

    assemble.dependsOn shadowJar
}
